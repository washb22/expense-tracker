services:
  - type: web
    name: moneylog-app
    env: python
    buildCommand: pip install -r requirements.txt
    # One web process plus exactly one explicit scheduler process.
    # Importing app.py itself starts neither migrations nor the scheduler.
    startCommand: bash scripts/start_production.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
